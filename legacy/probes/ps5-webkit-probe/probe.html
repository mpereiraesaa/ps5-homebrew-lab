R"HTML(<!doctype html>

<title>PS5 WebKit Capability Probe</title>

h1{font-size:38px;margin:0 0 8px}.sub{color:#9eb2ce;margin-bottom:24px}.card{background:#121f33;border:1px solid #29405e;border-radius:12px;padding:18px;margin:12px 0}

</style></head><body><main>

(function(){
